spring.application.name=demo

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:tasksdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always

# Worker Configuration
app.polling-interval=${POLLING_INTERVAL:5000}
app.max-retries=${MAX_RETRIES:3}
app.worker-enabled=${WORKER_ENABLED:true}
app.worker-queue=${WORKER_QUEUE:email}
